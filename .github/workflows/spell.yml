name: Spell check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  spell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.8
      - run: mise run spell
